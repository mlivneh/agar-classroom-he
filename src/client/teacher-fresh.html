<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>איפוס כיתה — Agar כיתתי</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    #msg { margin-top: 1rem; white-space: pre-wrap; }
    .hint { font-size: 0.9rem; color: #444; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>איפוס סשן כיתה</h1>
  <p>מנתק את כל השחקנים והצופים, מאפס את המפה, ומנקה טבלאות צ'אט / ניסיונות התחברות ב-SQLite.</p>
  <p class="hint">הסיסמה היא אותה <strong>סיסמת מנהל</strong> כמו במשחק (בקובץ config — ברירת מחדל לרוב DEFAULT).</p>
  <form id="f">
    <label for="pw">סיסמת מנהל</label>
    <input type="password" id="pw" autocomplete="current-password" required style="width:100%;box-sizing:border-box">
    <button type="submit">בצע איפוס</button>
  </form>
  <p id="msg"></p>
  <script>
    document.getElementById('f').onsubmit = async function (e) {
      e.preventDefault();
      var msg = document.getElementById('msg');
      msg.textContent = '';
      var password = document.getElementById('pw').value;
      try {
        var r = await fetch('/api/classroom-fresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        });
        var j = await r.json().catch(function () { return {}; });
        if (r.ok && j.ok) {
          msg.textContent = j.message || 'בוצע.';
          document.getElementById('pw').value = '';
        } else {
          msg.textContent = j.error || ('שגיאה ' + r.status);
        }
      } catch (err) {
        msg.textContent = 'שגיאת רשת: ' + err.message;
      }
    };
  </script>
</body>
</html>
